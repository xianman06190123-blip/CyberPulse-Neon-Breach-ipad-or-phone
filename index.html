<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CyberPulse: Neon Breach</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05050a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #080810;
        }
        
        /* Touch Overlay Controls */
        .touch-control {
            position: absolute;
            z-index: 100;
            display: none; /* Enabled via JS on touch devices */
        }
        #joystickZone {
            bottom: 30px;
            left: 30px;
            width: 140px;
            height: 140px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 240, 255, 0.3);
            border-radius: 50%;
        }
        #joystickKnob {
            position: absolute;
            top: 45px;
            left: 45px;
            width: 50px;
            height: 50px;
            background: rgba(0, 240, 255, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 15px #00f0ff;
        }
        #btnFire {
            bottom: 40px;
            right: 30px;
            width: 85px;
            height: 85px;
            background: rgba(255, 0, 85, 0.4);
            border: 2px solid #ff0055;
            border-radius: 50%;
            color: #fff;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
        }
        #btnDodge {
            bottom: 145px;
            right: 40px;
            width: 65px;
            height: 65px;
            background: rgba(0, 240, 255, 0.3);
            border: 2px solid #00f0ff;
            border-radius: 50%;
            color: #fff;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }
        #btnWeapon {
            bottom: 40px;
            right: 130px;
            width: 65px;
            height: 65px;
            background: rgba(255, 200, 0, 0.3);
            border: 2px solid #ffc800;
            border-radius: 50%;
            color: #fff;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            box-shadow: 0 0 10px rgba(255, 200, 0, 0.4);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <!-- Mobile Touch Controls -->
    <div id="joystickZone" class="touch-control">
        <div id="joystickKnob"></div>
    </div>
    <div id="btnFire" class="touch-control">FIRE</div>
    <div id="btnDodge" class="touch-control">DODGE</div>
    <div id="btnWeapon" class="touch-control">GUN ↻</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Detect Mobile / Touch Device
        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        if (isTouchDevice) {
            document.querySelectorAll('.touch-control').forEach(el => el.style.display = 'flex');
        }

        // Web Audio Synthesizer
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'shoot') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.1);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'hit') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'dodge') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            }
        }

        // Game State & Save Data
        let saveData = JSON.parse(localStorage.getItem('cyberpulse_save')) || {
            credits: 0,
            unlockedLevels: 1,
            color: '#00f0ff',
            hat: 'none',
            clothes: 'none',
            trail: 'none',
            inventory: ['color_#00f0ff', 'hat_none', 'clothes_none', 'trail_none']
        };

        function saveGame() {
            localStorage.setItem('cyberpulse_save', JSON.stringify(saveData));
        }

        let gameState = 'LOBBY'; // 'LOBBY' or 'PLAYING'
        let currentLevel = 1;
        let currentWave = 1;
        let creditsEarnedThisRun = 0;

        // Player Data
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 18,
            hp: 10,
            maxHp: 10,
            speed: 4.5,
            vx: 0,
            vy: 0,
            angle: 0,
            iFrames: 0,
            iFrameDuration: 1500, // 1.5s invincibility
            isDodging: false,
            dodgeTimer: 0,
            dodgeCooldown: 0,
            selectedWeapon: 0
        };

        const weapons = [
            { name: "Plasma Pistol", rate: 250, damage: 2, speed: 12, spread: 0.05 },
            { name: "Auto Rifle", rate: 120, damage: 1.5, speed: 14, spread: 0.12 },
            { name: "Spread Shotgun", rate: 600, damage: 1.2, count: 5, speed: 10, spread: 0.35 },
            { name: "Railgun", rate: 800, damage: 8, speed: 20, spread: 0 },
            { name: "Laser Stream", rate: 60, damage: 0.6, speed: 16, spread: 0.02 },
            { name: "Heavy Sniper Rifle", rate: 1000, damage: 15, speed: 24, spread: 0, pierce: true }
        ];

        let lastShotTime = 0;
        let keys = {};
        let mouse = { x: canvas.width / 2, y: canvas.height / 2, down: false };

        // Mobile Touch Inputs
        let touchMoveDir = { x: 0, y: 0 };
        let touchFiring = false;

        // Game Entities
        let enemies = [];
        let bullets = [];
        let enemyBullets = [];
        let particles = [];
        let spawnTimer = 0;

        // Touch Joystick Controls
        const joystickZone = document.getElementById('joystickZone');
        const joystickKnob = document.getElementById('joystickKnob');

        joystickZone.addEventListener('touchstart', handleJoystick, false);
        joystickZone.addEventListener('touchmove', handleJoystick, false);
        joystickZone.addEventListener('touchend', () => {
            touchMoveDir = { x: 0, y: 0 };
            joystickKnob.style.transform = 'translate(0px, 0px)';
        }, false);

        function handleJoystick(e) {
            e.preventDefault();
            initAudio();
            const touch = e.touches[0];
            const rect = joystickZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const dist = Math.hypot(dx, dy);
            const maxRadius = 45;

            if (dist > maxRadius) {
                dx = (dx / dist) * maxRadius;
                dy = (dy / dist) * maxRadius;
            }

            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            touchMoveDir = { x: dx / maxRadius, y: dy / maxRadius };
        }

        document.getElementById('btnFire').addEventListener('touchstart', (e) => {
            e.preventDefault();
            initAudio();
            touchFiring = true;
        });
        document.getElementById('btnFire').addEventListener('touchend', () => touchFiring = false);

        document.getElementById('btnDodge').addEventListener('touchstart', (e) => {
            e.preventDefault();
            triggerDodge();
        });

        document.getElementById('btnWeapon').addEventListener('touchstart', (e) => {
            e.preventDefault();
            player.selectedWeapon = (player.selectedWeapon + 1) % weapons.length;
        });

        // Mouse & Keyboard
        window.addEventListener('keydown', e => {
            initAudio();
            keys[e.code] = true;
            if (e.code.startsWith('Digit')) {
                const num = parseInt(e.code.replace('Digit', '')) - 1;
                if (num >= 0 && num < weapons.length) player.selectedWeapon = num;
            }
            if (e.code === 'Space') triggerDodge();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mousedown', e => {
            initAudio();
            if (e.button === 0) mouse.down = true;
            if (e.button === 2) triggerDodge();
        });
        window.addEventListener('mouseup', e => {
            if (e.button === 0) mouse.down = false;
        });
        window.addEventListener('contextmenu', e => e.preventDefault());

        function triggerDodge() {
            if (player.dodgeCooldown <= 0 && !player.isDodging) {
                player.isDodging = true;
                player.dodgeTimer = 250; // 250ms dodge
                player.dodgeCooldown = 1200;
                playSound('dodge');
            }
        }

        // Main Loop
        let lastTime = performance.now();
        function gameLoop(now) {
            const dt = now - lastTime;
            lastTime = now;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'LOBBY') {
                updateLobby();
                drawLobby();
            } else if (gameState === 'PLAYING') {
                updateGame(dt);
                drawGame();
            }

            requestAnimationFrame(gameLoop);
        }

        function startLevel(lvl) {
            currentLevel = lvl;
            currentWave = 1;
            player.hp = 10;
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            enemies = [];
            bullets = [];
            enemyBullets = [];
            particles = [];
            creditsEarnedThisRun = 0;
            gameState = 'PLAYING';
        }

        function updateGame(dt) {
            // Movement logic
            let moveX = 0;
            let moveY = 0;

            if (keys['KeyW'] || keys['ArrowUp']) moveY -= 1;
            if (keys['KeyS'] || keys['ArrowDown']) moveY += 1;
            if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

            if (isTouchDevice && (touchMoveDir.x !== 0 || touchMoveDir.y !== 0)) {
                moveX = touchMoveDir.x;
                moveY = touchMoveDir.y;
            }

            const moveMag = Math.hypot(moveX, moveY);
            let speedMultiplier = player.isDodging ? 2.5 : 1;
            if (moveMag > 0) {
                player.x += (moveX / (moveMag || 1)) * player.speed * speedMultiplier;
                player.y += (moveY / (moveMag || 1)) * player.speed * speedMultiplier;
            }

            // Keep in bounds
            player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
            player.y = Math.max(20, Math.min(canvas.height - 20, player.y));

            // Timers
            if (player.iFrames > 0) player.iFrames -= dt;
            if (player.dodgeCooldown > 0) player.dodgeCooldown -= dt;
            if (player.dodgeTimer > 0) {
                player.dodgeTimer -= dt;
                if (player.dodgeTimer <= 0) player.isDodging = false;
            }

            // Aim Direction
            if (isTouchDevice && !mouse.down) {
                if (enemies.length > 0) {
                    // Auto aim nearest enemy on mobile
                    let nearest = enemies[0];
                    let minDist = Math.hypot(enemies[0].x - player.x, enemies[0].y - player.y);
                    for (let i = 1; i < enemies.length; i++) {
                        let d = Math.hypot(enemies[i].x - player.x, enemies[i].y - player.y);
                        if (d < minDist) { minDist = d; nearest = enemies[i]; }
                    }
                    player.angle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
                }
            } else {
                player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
            }

            // Shooting
            if ((mouse.down || touchFiring) && performance.now() - lastShotTime > weapons[player.selectedWeapon].rate) {
                fireWeapon();
                lastShotTime = performance.now();
            }

            // Enemy Spawning Throttle
            spawnTimer += dt;
            if (spawnTimer > 2000 && enemies.length < 8) {
                spawnTimer = 0;
                spawnEnemy();
            }

            // Update Bullets
            bullets.forEach((b, index) => {
                b.x += b.vx;
                b.y += b.vy;
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(index, 1);
            });

            // Update Enemy Bullets
            enemyBullets.forEach((eb, index) => {
                eb.x += eb.vx;
                eb.y += eb.vy;
                
                // Bullet hit player
                if (Math.hypot(eb.x - player.x, eb.y - player.y) < player.radius && player.iFrames <= 0 && !player.isDodging) {
                    player.hp -= 1;
                    player.iFrames = player.iFrameDuration;
                    playSound('hit');
                    enemyBullets.splice(index, 1);
                }
            });

            // Update Enemies
            enemies.forEach((e, index) => {
                const distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);

                if (e.type === 'purple') {
                    // Purple Enemy: 3.0s cooldown normal attack (-1 HP)
                    e.attackCooldown = (e.attackCooldown || 0) + dt;
                    if (distToPlayer < 250) {
                        e.x += (player.x - e.x) * 0.015;
                        e.y += (player.y - e.y) * 0.015;
                    }

                    if (e.attackCooldown >= 3000) {
                        if (distToPlayer < 35 && player.iFrames <= 0 && !player.isDodging) {
                            player.hp -= 1; // -1 HP
                            player.iFrames = player.iFrameDuration;
                            playSound('hit');
                            e.attackCooldown = 0;
                        }
                    }
                } else if (e.type === 'red') {
                    // Red Enemy: Deals -2 HP
                    e.x += (player.x - e.x) * 0.008;
                    e.y += (player.y - e.y) * 0.008;

                    if (distToPlayer < 35 && player.iFrames <= 0 && !player.isDodging) {
                        player.hp -= 2; // -2 HP
                        player.iFrames = player.iFrameDuration;
                        playSound('hit');
                    }
                }

                // Bullet hits Enemy
                bullets.forEach((b, bIdx) => {
                    if (Math.hypot(b.x - e.x, b.y - e.y) < e.radius + 5) {
                        e.hp -= b.damage;
                        if (!b.pierce) bullets.splice(bIdx, 1);
                        if (e.hp <= 0) {
                            enemies.splice(index, 1);
                            saveData.credits += 15;
                            creditsEarnedThisRun += 15;
                            saveGame();
                        }
                    }
                });
            });

            // Player Defeat
            if (player.hp <= 0) {
                alert("SYSTEM BREACHED! GAME OVER.");
                gameState = 'LOBBY';
            }
        }

        function fireWeapon() {
            const w = weapons[player.selectedWeapon];
            playSound('shoot');
            
            const count = w.count || 1;
            for (let i = 0; i < count; i++) {
                const spreadAngle = player.angle + (Math.random() - 0.5) * w.spread;
                bullets.push({
                    x: player.x,
                    y: player.y,
                    vx: Math.cos(spreadAngle) * w.speed,
                    vy: Math.sin(spreadAngle) * w.speed,
                    damage: w.damage,
                    pierce: w.pierce || false
                });
            }
        }

        function spawnEnemy() {
            const isRed = Math.random() > 0.6;
            const side = Math.floor(Math.random() * 4);
            let x, y;
            if (side === 0) { x = Math.random() * canvas.width; y = -20; }
            else if (side === 1) { x = canvas.width + 20; y = Math.random() * canvas.height; }
            else if (side === 2) { x = Math.random() * canvas.width; y = canvas.height + 20; }
            else { x = -20; y = Math.random() * canvas.height; }

            enemies.push({
                x: x,
                y: y,
                radius: isRed ? 22 : 16,
                hp: isRed ? 12 : 5,
                type: isRed ? 'red' : 'purple',
                attackCooldown: 0
            });
        }

        // Drawing Functions
        function drawGame() {
            // Background Grid
            ctx.strokeStyle = '#101025';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Draw Player (with iFrames blink)
            if (player.iFrames <= 0 || Math.floor(performance.now() / 100) % 2 === 0) {
                ctx.save();
                ctx.translate(player.x, player.y);
                ctx.rotate(player.angle);

                ctx.fillStyle = saveData.color;
                ctx.shadowColor = saveData.color;
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
                ctx.fill();

                // Cannon
                ctx.fillStyle = '#fff';
                ctx.fillRect(5, -4, 18, 8);
                ctx.restore();
            }

            // Draw Enemies
            enemies.forEach(e => {
                ctx.save();
                ctx.fillStyle = e.type === 'red' ? '#ff0055' : '#a000ff';
                ctx.shadowColor = e.type === 'red' ? '#ff0055' : '#a000ff';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Draw Bullets
            ctx.fillStyle = '#00f0ff';
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw HUD (10 Segment HP Bar)
            drawHUD();
        }

        function drawHUD() {
            ctx.fillStyle = '#fff';
            ctx.font = '16px Segoe UI';
            ctx.fillText(`LEVEL ${currentLevel} - WAVE ${currentWave}/15`, 20, 35);
            ctx.fillText(`WEAPON: [${player.selectedWeapon + 1}] ${weapons[player.selectedWeapon].name}`, 20, 60);

            // 10 Segment HP Bar
            ctx.fillText(`HP:`, 20, 90);
            for (let i = 0; i < 10; i++) {
                ctx.fillStyle = i < player.hp ? '#00f0ff' : 'rgba(255,255,255,0.1)';
                ctx.fillRect(55 + i * 22, 77, 18, 14);
                ctx.strokeStyle = '#00f0ff';
                ctx.strokeRect(55 + i * 22, 77, 18, 14);
            }
        }

        // Lobby System UI
        function updateLobby() {}

        function drawLobby() {
            ctx.fillStyle = '#05050a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00f0ff';
            ctx.font = 'bold 36px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText("CYBERPULSE: NEON BREACH", canvas.width / 2, 80);

            ctx.fillStyle = '#aaa';
            ctx.font = '18px Segoe UI';
            ctx.fillText(`CREDITS: $${saveData.credits}`, canvas.width / 2, 120);

            // Start Button
            ctx.fillStyle = '#ff0055';
            ctx.fillRect(canvas.width / 2 - 120, canvas.height / 2 - 30, 240, 60);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 22px Segoe UI';
            ctx.fillText("ENTER MISSION", canvas.width / 2, canvas.height / 2 + 8);
        }

        canvas.addEventListener('click', (e) => {
            if (gameState === 'LOBBY') {
                const rect = canvas.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;

                if (clickX >= canvas.width / 2 - 120 && clickX <= canvas.width / 2 + 120 &&
                    clickY >= canvas.height / 2 - 30 && clickY <= canvas.height / 2 + 60) {
                    startLevel(1);
                }
            }
        });

        // Launch Game Engine
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
